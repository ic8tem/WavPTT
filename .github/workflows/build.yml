name: Compila WavPTT

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.24.x"

jobs:
  test:
    name: Test nucleo comune
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Test (audio, filtri, compressore, INI, coda PTT)
        run: |
          go mod tidy
          go test -count=1 -v ./core/ ./tci/

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Dipendenze
        run: go mod tidy
      - name: Compila
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -ldflags "-H windowsgui -s -w" -o WavPTT.exe .
      - name: Pacchetto
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg/WavPTT | Out-Null
          Copy-Item WavPTT.exe, packaging/LEGGIMI.txt pkg/WavPTT/
          Compress-Archive -Path pkg/WavPTT -DestinationPath WavPTT-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WavPTT-windows
          path: WavPTT-windows.zip

  linux:
    name: Linux
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Librerie di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev libgl1-mesa-dri xorg-dev xvfb imagemagick
      - name: Dipendenze
        run: go mod tidy
      - name: Compila
        run: go build -trimpath -ldflags "-s -w" -o WavPTT .
      - name: Prova di avvio con schermate dei sei schemi
        run: |
          mkdir -p prova && cp WavPTT prova/
          for t in Chiaro Notte Nero Blu Viola Verde; do
            linea=RTS; [ "$t" = "Viola" ] && linea=TCI
            printf '[Impostazioni]\r\nLinea=%s\r\nColori=%s\r\n' "$linea" "$t" > prova/WavPTT.ini
            xvfb-run -a -s "-screen 0 1280x800x24" bash -c "
              ./prova/WavPTT & PID=\$!
              sleep 8
              import -window root schermata-$t.png
              kill \$PID || true"
            convert schermata-$t.png -trim +repage schermata-$t.png
            echo "SCHERMATA-$t-INIZIO"; base64 -w0 schermata-$t.png; echo; echo "SCHERMATA-FINE"
          done
          cp schermata-Notte.png schermata-linux.png
      - uses: actions/upload-artifact@v4
        with:
          name: schermata-linux
          path: schermata-linux.png
      - name: Pacchetto
        run: |
          mkdir -p pkg/WavPTT
          cp WavPTT Icon.png packaging/LEGGIMI.txt packaging/wavptt.desktop pkg/WavPTT/
          tar czf WavPTT-linux-x86_64.tar.gz -C pkg WavPTT
      - uses: actions/upload-artifact@v4
        with:
          name: WavPTT-linux
          path: WavPTT-linux-x86_64.tar.gz

  macos:
    name: Mac
    needs: test
    # macchina Intel: quelle Apple Silicon di GitHub sono spesso sature;
    # il programma viene comunque compilato per entrambi i processori
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Dipendenze
        run: go mod tidy
      - name: Compila (Apple Silicon e Intel)
        env:
          CGO_ENABLED: "1"
        run: |
          GOARCH=arm64 CC="clang -arch arm64" go build -trimpath -ldflags "-s -w" -o WavPTT-arm64 .
          GOARCH=amd64 CC="clang -arch x86_64" go build -trimpath -ldflags "-s -w" -o WavPTT-amd64 .
          lipo -create -output WavPTT WavPTT-arm64 WavPTT-amd64
          lipo -info WavPTT
      - name: Pacchetto WavPTT.app
        run: |
          APP=pkg/WavPTT/WavPTT.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp WavPTT "$APP/Contents/MacOS/WavPTT"
          cp packaging/Info.plist "$APP/Contents/Info.plist"
          mkdir icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s Icon.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d Icon.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/icon.icns"
          codesign --force --deep -s - "$APP"
          cp packaging/LEGGIMI.txt pkg/WavPTT/
          ditto -c -k --keepParent pkg/WavPTT WavPTT-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WavPTT-mac
          path: WavPTT-mac.zip

  # pubblica nelle Releases: con un tag vNN, oppure con "[pubblica]" nel
  # messaggio del commit su main (versione letta da packaging/VERSIONE)
  release:
    name: Pubblica la versione
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[pubblica]'))
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versione
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="$GITHUB_REF_NAME"; else v=$(tr -d '[:space:]' < packaging/VERSIONE); fi
          echo "tag=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: WavPTT ${{ steps.ver.outputs.tag }}
          body: |
            WavPTT ${{ steps.ver.outputs.tag }} per Windows, Mac (Apple Silicon e Intel) e Linux.
            Istruzioni per il primo avvio nel file LEGGIMI.txt dentro ogni pacchetto.
          files: |
            dist/WavPTT-windows.zip
            dist/WavPTT-mac.zip
            dist/WavPTT-linux-x86_64.tar.gz
